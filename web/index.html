<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="StackDesk library circulation and catalog workspace">
  <title>StackDesk Library</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2326564b'/%3E%3Cpath d='M8 8h5v16H8zm7 0h4v16h-4zm7 1 5 14-4 1-5-14z' fill='%23c8ecba'/%3E%3C/svg%3E">
  <script src="/app.js" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbol-bank" aria-hidden="true">
    <symbol id="i-brand" viewBox="0 0 24 24"><path d="M4 4h4v16H4zm7 0h4v16h-4zm7 1 4 14-3 1-4-14z"/></symbol>
    <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1 0-4h14M8 7h8m-8 4h5"/></symbol>
    <symbol id="i-readers" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 5a3 3 0 1 1 0 6m5 9v-2a4 4 0 0 0-3-4"/></symbol>
    <symbol id="i-loan" viewBox="0 0 24 24"><path d="M4 8h16m-4-4 4 4-4 4m4 4H4m4 4-4-4 4-4"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M4 3v17h17M9 15v-5m5 5V7m5 8V4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-stock" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16m-10 4h4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </svg>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="StackDesk overview">
        <span class="brand-symbol"><svg class="icon" aria-hidden="true"><use href="#i-brand"></use></svg></span>
        <span><strong>StackDesk</strong><small>Library desk</small></span>
      </a>
      <nav class="navigation" aria-label="Library workspace">
        <a href="#overview" data-page="overview" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-overview"></use></svg><span>Overview</span></a>
        <a href="#catalog" data-page="catalog"><svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg><span>Catalog</span></a>
        <a href="#readers" data-page="readers"><svg class="icon" aria-hidden="true"><use href="#i-readers"></use></svg><span>Readers</span></a>
        <a href="#circulation" data-page="circulation"><svg class="icon" aria-hidden="true"><use href="#i-loan"></use></svg><span>Circulation</span></a>
        <a href="#reservations" data-page="reservations"><svg class="icon" aria-hidden="true"><use href="#i-queue"></use></svg><span>Reservations</span></a>
        <a href="#reports" data-page="reports"><svg class="icon" aria-hidden="true"><use href="#i-report"></use></svg><span>Reports</span></a>
      </nav>
      <div class="sidebar-footer"><span class="session-dot"></span><span id="session-mode">Local desk</span></div>
    </aside>

    <div class="work-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Library</span><span aria-hidden="true">/</span><strong id="location-name">Overview</strong></div>
        <div class="business-date">
          <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
          <time id="business-date">Loading desk</time>
          <button id="advance-date" class="button small" type="button" hidden data-do="advance">Advance date</button>
        </div>
      </header>
      <main id="view" aria-busy="true">
        <div class="page-heading"><h1>Library overview</h1></div>
        <section class="panel empty"><h2>Loading your library</h2><p>Connecting to the StackDesk desk.</p></section>
      </main>
    </div>
  </div>

  <dialog id="desk-dialog" aria-labelledby="dialog-title">
    <header class="dialog-header">
      <h2 id="dialog-title"></h2>
      <button class="icon-button" id="dialog-close" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </header>
    <div id="dialog-body"></div>
  </dialog>

  <div id="feedback" role="status" aria-live="polite" class="feedback" hidden></div>
</body>
</html>
